<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Helpdesk - Smart AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --gray: #64748b;
            --light: #f1f5f9;
            --white: #ffffff;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--dark);
            color: var(--white);
        }

        .app-container {
            display: flex;
            height: 100vh;
            background: var(--dark);
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 320px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .nav-btn {
            padding: 0.75rem 1rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .conversation-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-item:hover {
            background: rgba(99, 102, 241, 0.15);
            border-left-color: var(--primary);
        }

        .new-chat-btn {
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .admin-link {
            padding: 0.75rem 1rem;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: var(--secondary);
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
        }

        .admin-link:hover {
            background: rgba(236, 72, 153, 0.2);
            border-color: var(--secondary);
        }

        /* ==================== MAIN CHAT ==================== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark);
        }

        .chat-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
        }

        .chat-header-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .chat-header-subtitle {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .agent-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .welcome-section {
            text-align: center;
            margin: auto;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .welcome-subtitle {
            color: var(--gray);
            margin-bottom: 2rem;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            max-width: 600px;
        }

        .quick-action-btn {
            padding: 1rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quick-action-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .message.user .message-avatar {
            background: rgba(236, 72, 153, 0.2);
            color: var(--secondary);
        }

        .message-content {
            max-width: 70%;
        }

        .message.user .message-content {
            text-align: right;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.assistant .message-bubble {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--white);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .message-agents {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .agent-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-right: 0.3rem;
            font-weight: 500;
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            max-width: 1200px;
        }

        .input-field {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            border-radius: 25px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-field::placeholder {
            color: var(--gray);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.6);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 1rem;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }

            .logo-section {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
                flex-shrink: 0;
            }

            .logo-text {
                font-size: 1rem;
            }

            .nav-buttons {
                flex-direction: row;
                margin-bottom: 0;
                gap: 0.5rem;
                flex: 1;
            }

            .nav-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.85rem;
            }

            .conversation-list {
                display: none;
            }

            .new-chat-btn {
                display: none;
            }

            .messages-area {
                padding: 1rem;
            }

            .message-content {
                max-width: 90%;
            }

            .input-area {
                padding: 1rem;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .chat-header {
                padding: 1rem;
            }

            .chat-header-title {
                font-size: 1rem;
            }

            .messages-area {
                padding: 0.75rem;
                gap: 0.75rem;
            }

            .message-content {
                max-width: 100%;
            }

            .input-wrapper {
                gap: 0.5rem;
            }

            .send-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">🎓</div>
                <div class="logo-text">Campus Helpdesk</div>
                <div class="logo-subtitle">AI Assistant</div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchView('chat')">
                    <i class="fas fa-comments"></i>
                    <span>Chat</span>
                </button>
                <button class="nav-btn" onclick="switchView('dashboard')">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </button>
            </div>

            <div class="conversation-list">
                <div style="color: var(--gray); font-size: 0.85rem; margin-bottom: 1rem; text-transform: uppercase; font-weight: 600;">Recent</div>
                <div class="conversation-item">📚 Course schedule inquiry</div>
                <div class="conversation-item">📍 Library location help</div>
                <div class="conversation-item">✏️ Assignment submission</div>
            </div>

            <button class="new-chat-btn">
                <i class="fas fa-plus"></i>
                <span>New Chat</span>
            </button>

            <a href="/admin" class="admin-link">
                <i class="fas fa-lock"></i> Admin Panel
            </a>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div>
                    <div class="chat-header-title">Chat Assistant</div>
                    <div class="chat-header-subtitle">Ask anything about campus</div>
                </div>
                <div class="agent-status">
                    <span class="status-dot"></span>
                    <span>5 Agents Online</span>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea">
                <div class="welcome-section">
                    <div class="welcome-icon">👋</div>
                    <div class="welcome-title">Welcome to Campus Helpdesk</div>
                    <div class="welcome-subtitle">Get instant answers about your college</div>
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="sendQuickMessage('What is my attendance?')">📊 Attendance</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('Where is the library?')">📍 Navigation</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('Upcoming events?')">🎉 Events</button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('Faculty contact info')">👨‍🏫 Faculty</button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="userInput" 
                        class="input-field" 
                        placeholder="Ask anything about college... (e.g., 'What's my attendance?')"
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userName = "Anonymous";

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            input.value = '';

            // Send to API
            fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text,
                    user_name: userName
                })
            })
            .then(res => res.json())
            .then(data => {
                const response = data.response || 'No response available';
                const agents = data.agents || [];
                addMessage(response, 'assistant', agents);
            })
            .catch(err => {
                console.error('Error:', err);
                addMessage('Sorry, something went wrong. Please try again.', 'assistant');
            });
        }

        function sendQuickMessage(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        function addMessage(text, sender, agents = []) {
            const messagesArea = document.getElementById('messagesArea');
            
            // Remove welcome section if exists
            const welcome = messagesArea.querySelector('.welcome-section');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = sender === 'user' ? '👤' : '🤖';
            const agentsList = agents.length > 0 ? `<div class="message-agents">Agents: ${agents.map(a => `<span class="agent-badge">${a}</span>`).join('')}</div>` : '';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-bubble">${text}</div>
                    ${agentsList}
                </div>
            `;
            
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function switchView(view) {
            if (view === 'dashboard') {
                window.location.href = '/';
            }
        }

        // Set random user name on load
        window.addEventListener('load', function() {
            const firstNames = ['Student', 'Scholar', 'Learner'];
            userName = firstNames[Math.floor(Math.random() * firstNames.length)];
        });
    </script>
</body>
</html>
